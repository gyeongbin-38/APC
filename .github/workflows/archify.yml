name: render-archify

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/apc.architecture.json'
      - '.github/workflows/archify.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases-v4, verified GitHub commit
        with:
          persist-credentials: false
      - name: Checkout pinned Archify
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tt-a1i/archify
          ref: c826e6c3a7abad19c0f3cd1ca57207d54b1ad8de # Archify v2.16.0 commit
          path: .archify-upstream
          persist-credentials: false
      - name: Render and validate architecture map
        run: |
          node .archify-upstream/archify/bin/archify.mjs deliver \
            architecture \
            docs/architecture/apc.architecture.json \
            docs/architecture/apc.html \
            --quality standard \
            --repo-root "$GITHUB_WORKSPACE" \
            --json
      - name: Commit generated artifact when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/apc.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Archify architecture map"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi
