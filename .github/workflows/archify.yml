name: render-archify

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/apc.architecture.json'
      - '.github/workflows/archify.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Archify
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          ref: v2.16.0
          path: .archify-upstream
      - name: Render and validate architecture map
        run: |
          node .archify-upstream/archify/bin/archify.mjs deliver \
            architecture \
            docs/architecture/apc.architecture.json \
            docs/architecture/apc.html \
            --quality standard \
            --repo-root "$GITHUB_WORKSPACE" \
            --json
      - name: Commit generated artifact when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/apc.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Archify architecture map"
            git push
          fi
