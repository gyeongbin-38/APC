name: validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases-v4, verified GitHub commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 line, verified GitHub commit
        with:
          python-version: '3.11'
      - run: python -m pip install 'scikit-learn==1.9.0'
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/structural/run_benchmark.py > /tmp/benchmark.json
      - run: python benchmarks/trigger-boundary/run_benchmark.py > /tmp/trigger-benchmark.json
      - run: python benchmarks/constraint-fuzz/run_fuzz.py > /tmp/constraint-fuzz.json
      - run: python benchmarks/public-repos/run_benchmark.py > /tmp/public-repo-benchmark.json
      - run: python benchmarks/security-adversarial/run_benchmark.py > /tmp/security-benchmark.json
      - run: python benchmarks/security-efficiency/run_benchmark.py > /tmp/security-efficiency.json
      - name: Verify committed benchmark evidence is fresh
        run: python benchmarks/check_results_fresh.py
