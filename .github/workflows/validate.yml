name: validate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip scikit-learn
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/structural/run_benchmark.py > /tmp/benchmark.json
      - run: python benchmarks/trigger-boundary/run_benchmark.py > /tmp/trigger-benchmark.json
      - run: python benchmarks/constraint-fuzz/run_fuzz.py > /tmp/constraint-fuzz.json
      - run: python benchmarks/public-repos/run_benchmark.py > /tmp/public-repo-benchmark.json
